name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a supported SemVer release tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Acterion.Agents.AI.slnx

      - name: Build
        run: >-
          dotnet build Acterion.Agents.AI.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: >-
          dotnet test
          --solution Acterion.Agents.AI.slnx
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: >-
          dotnet pack
          src/Acterion.Agents.AI.Microsoft365.Retrieval/Acterion.Agents.AI.Microsoft365.Retrieval.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}

      - name: Validate release artifacts
        shell: bash
        run: |
          package="artifacts/packages/Acterion.Agents.AI.Microsoft365.Retrieval.${{ steps.version.outputs.version }}"
          test -f "$package.nupkg"
          test -f "$package.snupkg"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      - name: NuGet login via Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: luismanez

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push
          artifacts/packages/Acterion.Agents.AI.Microsoft365.Retrieval.${{ steps.version.outputs.version }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="artifacts/packages/Acterion.Agents.AI.Microsoft365.Retrieval.${{ steps.version.outputs.version }}"
          release_args=(
            "$GITHUB_REF_NAME"
            "$package.nupkg"
            "$package.snupkg"
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )

          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi

          gh release create "${release_args[@]}"
