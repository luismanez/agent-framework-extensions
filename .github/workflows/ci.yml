name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Acterion.Agents.AI.slnx

      - name: Build
        run: dotnet build Acterion.Agents.AI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Acterion.Agents.AI.slnx --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Acterion.Agents.AI.Microsoft365.Retrieval/Acterion.Agents.AI.Microsoft365.Retrieval.csproj \
            --configuration Release --no-build --no-restore --output artifacts/packages
          dotnet pack src/Acterion.Agents.AI.Microsoft365.WorkContext/Acterion.Agents.AI.Microsoft365.WorkContext.csproj \
            --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Validate package artifacts
        shell: bash
        run: |
          version="$(dotnet msbuild src/Acterion.Agents.AI.Microsoft365.Retrieval/Acterion.Agents.AI.Microsoft365.Retrieval.csproj -getProperty:Version)"
          for package_id in Acterion.Agents.AI.Microsoft365.Retrieval Acterion.Agents.AI.Microsoft365.WorkContext; do
            for extension in nupkg snupkg; do
              test -s "artifacts/packages/$package_id.$version.$extension"
            done
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
