name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Acterion.Agents.AI.slnx

      - name: Build
        run: dotnet build Acterion.Agents.AI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Acterion.Agents.AI.slnx --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack
          src/Acterion.Agents.AI.Microsoft365.Retrieval/Acterion.Agents.AI.Microsoft365.Retrieval.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
